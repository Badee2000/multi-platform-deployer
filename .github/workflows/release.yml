name: Release

# Runs when a version tag such as v1.0.0 is pushed. It builds and checks the
# package and creates a GitHub release with the files attached. It does NOT
# publish to PyPI and uses no deployment credentials.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches the package version
        run: |
          python - <<'PY'
          import os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != version:
              raise SystemExit(f"Tag {tag} does not match pyproject.toml version {version}")
          print(f"Version {version} matches the tag")
          PY

      - name: Install and run the tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest tests -q

      - name: Build and check the package
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
