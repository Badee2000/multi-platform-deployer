[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["multi_platform_deployer*"]

[project]
name = "multi-platform-deployer"
version = "0.3.0"
description = "Pre-deploy checks and one-command deploys for Flask, Django and FastAPI apps. Render verified; Vercel, Railway and Heroku experimental."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Badee Esmandar"}
]
keywords = [
    "deployment", "deploy", "cli", "devops", "flask", "django", "fastapi",
    "render", "vercel", "railway", "heroku", "health-check", "rollback",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]

dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
    "types-PyYAML>=6.0.0",
    "isort>=5.12.0",
]

[project.scripts]
multi-platform-deployer = "multi_platform_deployer.cli:main"

[project.urls]
Homepage = "https://github.com/Badee2000/multi-platform-deployer"
Documentation = "https://github.com/Badee2000/multi-platform-deployer#readme"
Repository = "https://github.com/Badee2000/multi-platform-deployer"
Changelog = "https://github.com/Badee2000/multi-platform-deployer/blob/main/CHANGELOG.md"
Issues = "https://github.com/Badee2000/multi-platform-deployer/issues"

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
